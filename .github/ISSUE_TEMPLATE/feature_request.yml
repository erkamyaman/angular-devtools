name: Feature request
description: Suggest an inspector, a view or an agent tool
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to understand or debug in your Angular app?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like to see
      description: The view, data or agent tool that would help. Mockups are welcome.
    validations:
      required: true
  - type: textarea
    id: angular
    attributes:
      label: Angular APIs involved
      description: Debug APIs or framework internals that could provide the data, if you know them.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this
