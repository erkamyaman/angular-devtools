name: Bug report
description: Something in the devtools shows wrong data, breaks, or looks wrong
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Components
        - Signals
        - Injectors
        - Router
        - Forms
        - NgRx store
        - Pipes
        - SSR & HTTP
        - Analog
        - Dashboard or panel shell
        - Chrome extension
        - Agent tools (MCP)
        - Vite plugin or setup
        - Demo app
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, a minimal repository, or the page of the demo app where it happens.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Angular, @santoshyadavdev/ng-devtools, browser, and Analog if used.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
