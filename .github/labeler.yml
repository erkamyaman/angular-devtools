'area: panel':
  - changed-files:
      - any-glob-to-any-file: ['app/**']

'area: package':
  - changed-files:
      - any-glob-to-any-file: ['packages/ng-devtools/**', 'bin.mjs']

'area: extension':
  - changed-files:
      - any-glob-to-any-file: ['extension/**']

'area: demo':
  - changed-files:
      - any-glob-to-any-file: ['src/**', 'public/**', 'examples/**']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['apps/docs/**', 'docs/**', '*.md']

'area: agents':
  - changed-files:
      - any-glob-to-any-file: ['.claude/**', 'AGENTS.md', 'CLAUDE.md']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', '.githooks/**', 'scripts/**']
